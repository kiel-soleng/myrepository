<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Fund Health Rings — UCSC Plugin</title>
<script src="https://unpkg.com/@sigmacomputing/plugin"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,Roboto,"Segoe UI",Arial,sans-serif;background:transparent;color:#1A1A1A;overflow:hidden}
  #wrap{height:100%;width:100%;display:flex;flex-direction:column;padding:8px 10px;gap:6px}
  #grid{flex:1;display:grid;grid-auto-flow:column;gap:12px;place-items:stretch;min-height:0}
  .fund{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;gap:6px}
  .fund-name{font-size:12px;font-weight:700;color:#003C6C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .ring-wrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;width:100%}
  .ring-pct{font-weight:800;fill:#1A1A1A}
  .ring-sub{font-weight:600;fill:#5F5F66}
  .badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
  #legend{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:16px;font-size:11px;color:#5F5F66;flex-wrap:wrap}
  #legend .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}
</style>
</head>
<body>
<div id="wrap">
  <div id="grid"></div>
  <div id="legend">
    <span><i class="dot" style="background:#003C6C"></i>Expended</span>
    <span><i class="dot" style="background:#FDC700"></i>Encumbered</span>
    <span><i class="dot" style="background:#E2E2E2"></i>Available</span>
    <span>Ring = share of Budget Amount</span>
  </div>
</div>
<script>
(function(){
  var client=(window.sigmaComputing&&window.sigmaComputing.plugin&&window.sigmaComputing.plugin.client)||null;
  var defs=[
    {name:'source',type:'element'},
    {name:'fund',type:'column',source:'source',label:'Fund'},
    {name:'budget',type:'column',source:'source',allowedTypes:['number','integer'],label:'Budget Amount'},
    {name:'expenditures',type:'column',source:'source',allowedTypes:['number','integer'],label:'Expenditures'},
    {name:'encumbrances',type:'column',source:'source',allowedTypes:['number','integer'],label:'Encumbrances'}
  ];
  if(client) client.config.configureEditorPanel(defs);

  function money(n){
    var sign = n<0 ? '-' : '';
    var abs = Math.abs(n);
    if(abs>=1000000) return sign+'$'+(abs/1000000).toFixed(1)+'M';
    if(abs>=1000) return sign+'$'+(abs/1000).toFixed(0)+'K';
    return sign+'$'+abs.toFixed(0);
  }

  function healthLevel(availablePct){
    if(availablePct<0) return {bg:'#FCEBEB', fg:'#D14343', ring:'#D14343'};
    if(availablePct<10) return {bg:'#FFF3E2', fg:'#C77A0A', ring:'#F29813'};
    return {bg:'#EAF7EE', fg:'#1F9D55', ring:null};
  }

  function sizeFor(budget, maxBudget, minD, maxD){
    var frac = Math.sqrt(Math.max(0, Math.min(1, budget/maxBudget)));
    return minD + frac*(maxD-minD);
  }

  // Three-segment ring: expended (blue) -> encumbered (gold) -> remainder
  // (light gray track). Center label is % of budget still AVAILABLE (a
  // budget-health read, not a growth metric) -- a static warning ring
  // (not an animated pulse) appears when availability drops below 10%.
  function ringSVG(size, expPct, encPct, availPct, lvl){
    var r = 15.5, c = 2*Math.PI*r, sw = 4.2;
    var expLen = c*(Math.max(0,Math.min(100,expPct))/100);
    var encLen = c*(Math.max(0,Math.min(100,encPct))/100);
    var warnRing = lvl.ring ? '<circle cx="18" cy="18" r="'+(r+3)+'" fill="none" stroke="'+lvl.ring+'" stroke-width="1.4" stroke-dasharray="2 2"/>' : '';
    var fontSize = 10.5, subSize = 6.5;
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 36 36">'+
      warnRing+
      '<circle cx="18" cy="18" r="'+r+'" fill="none" stroke="#E2E2E2" stroke-width="'+sw+'"/>'+
      '<circle cx="18" cy="18" r="'+r+'" fill="none" stroke="#FDC700" stroke-width="'+sw+'" '+
        'stroke-dasharray="'+encLen+' '+(c-encLen)+'" stroke-dashoffset="'+(-expLen+c*0.25)+'" stroke-linecap="butt"/>'+
      '<circle cx="18" cy="18" r="'+r+'" fill="none" stroke="#003C6C" stroke-width="'+sw+'" '+
        'stroke-dasharray="'+expLen+' '+(c-expLen)+'" stroke-dashoffset="'+(c*0.25)+'" stroke-linecap="butt"/>'+
      '<text x="18" y="16.5" text-anchor="middle" dominant-baseline="central" class="ring-pct" style="font-size:'+fontSize+'px;">'+Math.round(availPct)+'%</text>'+
      '<text x="18" y="23" text-anchor="middle" dominant-baseline="central" class="ring-sub" style="font-size:'+subSize+'px;">avail</text>'+
      '</svg>';
  }

  function draw(funds){
    // Row order from subscribeToElementData doesn't reliably follow the
    // source query's ORDER BY -- sort explicitly, largest fund first.
    funds = funds.slice().sort(function(a,b){ return b.budget - a.budget; });
    var grid=document.getElementById('grid');
    grid.style.gridTemplateColumns='repeat('+(funds.length||1)+',1fr)';
    grid.innerHTML='';
    var maxBudget=Math.max.apply(null, funds.map(function(f){return f.budget;}).concat([1]));

    funds.forEach(function(f){
      var spent = f.expenditures + f.encumbrances;
      var balance = f.budget - spent;
      var expPct = f.budget>0 ? (f.expenditures/f.budget*100) : 0;
      var encPct = f.budget>0 ? (f.encumbrances/f.budget*100) : 0;
      var availPct = f.budget>0 ? (balance/f.budget*100) : 0;
      var size = sizeFor(f.budget, maxBudget*1.1, 64, 128);
      var lvl = healthLevel(availPct);
      var wrap=document.createElement('div'); wrap.className='fund';
      wrap.innerHTML =
        '<div class="fund-name">'+f.fund+'</div>'+
        '<div class="ring-wrap">'+ringSVG(size, expPct, encPct, availPct, lvl)+'</div>'+
        '<span class="badge" style="background:'+lvl.bg+';color:'+lvl.fg+';">'+money(balance)+' left</span>';
      grid.appendChild(wrap);
    });
  }

  function synth(){
    return [
      {fund:'State General Fund (19900)', budget:8200000, expenditures:5100000, encumbrances:1400000},
      {fund:'UC General Funds (20000)', budget:4600000, expenditures:3300000, encumbrances:900000},
      {fund:'Student Services Fee', budget:2100000, expenditures:1250000, encumbrances:300000},
      {fund:'Gift & Endowment Income', budget:1500000, expenditures:600000, encumbrances:150000},
      {fund:'Auxiliary Enterprise', budget:1900000, expenditures:1750000, encumbrances:250000}
    ];
  }

  var st={cfg:{},data:null,unsub:null};
  function recompute(){
    var c=st.cfg||{};
    if(st.data && c.fund && st.data[c.fund]){
      var fund=st.data[c.fund]||[],
          budget=(c.budget&&st.data[c.budget])||[],
          exp=(c.expenditures&&st.data[c.expenditures])||[],
          enc=(c.encumbrances&&st.data[c.encumbrances])||[];
      var out=fund.map(function(name,i){return {
        fund:String(name),
        budget:Number(budget[i])||0,
        expenditures:Number(exp[i])||0,
        encumbrances:Number(enc[i])||0
      };});
      if(out.length){ draw(out); return; }
    }
    draw(synth());
  }
  if(client){
    client.config.subscribe(function(cfg){
      st.cfg=cfg||{};
      if(st.unsub){st.unsub();st.unsub=null;}
      if(cfg&&cfg.source){st.unsub=client.elements.subscribeToElementData(cfg.source,function(d){st.data=d;recompute();});}
      recompute();
    });
  }else{ recompute(); }

  // Sigma sizes the panel AFTER first paint -- redraw on any container resize.
  var ro=new ResizeObserver(function(){ recompute(); });
  ro.observe(document.getElementById('wrap'));
})();
</script>
</body>
</html>
